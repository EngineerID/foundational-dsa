name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - run: pip install pytest pytest-cov hypothesis
      - run: npm run check:stubs
      - run: npm run test:java
      - run: PYTEST_COV=1 npm run test:py
      - run: npm run test:js
      - run: npm run check:parity
      - run: node tools/coverage-report.mjs
      - run: npm run matrix
      - uses: actions/upload-artifact@v4
        with:
          name: line-coverage-report
          path: coverage/
      - run: npm run matrix:check

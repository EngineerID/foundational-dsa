name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: npm ci
      - run: pip install pytest pytest-cov hypothesis ruff
      - run: npm run lint
      - run: npm run check:stubs
      - run: npm run test:java
      - run: PYTEST_COV=1 npm run test:py
      - run: npm run test:js
      - run: npm run check:parity
      - run: npm run check:edge-themes
      - run: node tools/coverage-report.mjs
      - run: npm run matrix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: line-coverage-report
          path: coverage/
      - run: npm run matrix:check

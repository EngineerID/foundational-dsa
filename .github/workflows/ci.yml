name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_heavy: ${{ steps.decision.outputs.run_heavy }}
    steps:
      - name: Checkout (push only)
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Path filter
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: none
          filters: |
            heavy:
              - 'java/**'
              - 'python/**'
              - 'javascript/**'
              - 'tools/**'
              - 'package.json'
              - 'package-lock.json'
              - 'Makefile'
              - '.github/workflows/ci.yml'
              - '.github/workflows/secret-scan.yml'
              - '.cursor/**'
              - 'reference/**'

      - name: Decide RUN_HEAVY
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          FILTER_HEAVY: ${{ steps.filter.outputs.heavy }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            is_draft="$IS_DRAFT"
            if [[ -n "${PR_NUMBER:-}" && -n "${GH_TOKEN:-}" ]]; then
              live_draft="$(curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
                | jq -r '.draft')"
              if [[ "$live_draft" == "true" || "$live_draft" == "false" ]]; then
                is_draft="$live_draft"
              fi
            fi
            if [[ "$PR_ACTION" == "ready_for_review" ]]; then
              is_draft="false"
            fi
            if [[ "$is_draft" == "true" ]]; then
              echo "run_heavy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ ! "$PR_CHANGED_FILES" =~ ^[0-9]+$ ]]; then
              echo "::warning::Missing PR changed-files count; running heavy CI"
              echo "run_heavy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ((PR_CHANGED_FILES > 3000)); then
              echo "run_heavy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          case "$FILTER_HEAVY" in
            true) echo "run_heavy=true" >> "$GITHUB_OUTPUT" ;;
            false) echo "run_heavy=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::warning::Unexpected path-filter result; running heavy CI"
              echo "run_heavy=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

  ci-policy:
    name: ci-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          archive="/tmp/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$archive"
          tar -xzf "$archive" -C /usr/local/bin actionlint
          actionlint -version

      - name: actionlint
        run: actionlint -color

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: CI policy script and tests
        run: |
          node scripts/ci-policy.mjs
          node --test scripts/ci-policy.test.mjs

  build-test:
    needs: [changes]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      RUN_HEAVY: ${{ needs.changes.outputs.run_heavy }}
    steps:
      - name: Heavy CI gate
        run: |
          if [[ "${RUN_HEAVY}" != "true" ]]; then
            echo "Skipping heavy CI (draft pull request or non-impacting changes)."
          else
            echo "Running full build-test job."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_HEAVY == 'true'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: env.RUN_HEAVY == 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java/pom.xml

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.RUN_HEAVY == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.RUN_HEAVY == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
        if: env.RUN_HEAVY == 'true'

      - run: pip install pytest pytest-cov hypothesis ruff
        if: env.RUN_HEAVY == 'true'

      - run: npm run lint
        if: env.RUN_HEAVY == 'true'

      - run: npm run check:stubs
        if: env.RUN_HEAVY == 'true'

      - run: npm run test:java
        if: env.RUN_HEAVY == 'true'

      - run: PYTEST_COV=1 npm run test:py
        if: env.RUN_HEAVY == 'true'

      - run: npm run test:js
        if: env.RUN_HEAVY == 'true'

      - run: npm run check:parity
        if: env.RUN_HEAVY == 'true'

      - run: npm run check:edge-themes
        if: env.RUN_HEAVY == 'true'

      - run: node tools/coverage-report.mjs
        if: env.RUN_HEAVY == 'true'

      - run: npm run matrix
        if: env.RUN_HEAVY == 'true'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.RUN_HEAVY == 'true'
        with:
          name: line-coverage-report
          path: coverage/

      - run: npm run matrix:check
        if: env.RUN_HEAVY == 'true'

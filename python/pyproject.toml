[project]
name = "dsa"
version = "1.0.0"
description = "Data structures and algorithms (Python)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["F", "I", "UP"]
ignore = ["E501"]
